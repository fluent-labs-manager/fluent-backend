name: "fluent-dev"
services:
  redis:
    image: redis:latest
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - api-entrypoint-redis-data:/data
    ports:
      - "17200:6379"
    networks:
      - fluent-dev-net

  api-entrypoint-pg:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${API_ENTRYPOINT_DB_USER}
      POSTGRES_PASSWORD: ${API_ENTRYPOINT_DB_PASSWORD}
    volumes:
      - api-entrypoint-pg-data:/var/lib/postgresql/data
    ports:
      - "17100:5432"
    networks:
      - fluent-dev-net

  api-entrypoint:
    image: scobca/fluent-api-entrypoint:dev
    restart: always
    ports:
      - "17000:8080"
    volumes:
      - api-entrypoint-data:/var/
    networks:
      - fluent-dev-net

volumes:
  api-entrypoint-pg-data:
  api-entrypoint-redis-data:
  api-entrypoint-data:

networks:
  fluent-dev-net:
    driver: bridge
