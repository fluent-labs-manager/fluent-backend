spring:
  application:
    name: api-entrypoint
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true

database:
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  schema: public

server:
  port: 8080