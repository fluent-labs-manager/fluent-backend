spring:
  application:
    name: users-service
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

database:
  url: ${USERS_SERVICE_DB_URL}
  username: ${USERS_SERVICE_DB_USERNAME}
  password: ${USERS_SERVICE_DB_PASSWORD}
  schema: public

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  database: ${REDIS_DATABASE}

server:
  port: 8082