spring:
  application:
    name: users-service

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 1s

database:
  url: ${USERS_SERVICE_DB_URL}
  username: ${USERS_SERVICE_DB_USERNAME}
  password: ${USERS_SERVICE_DB_PASSWORD}
  schema: public

server:
  port: 8082