$kind: http-example
request:
  url: "{{url}}/api/v1/users/:id"
  method: PATCH
  pathVariables:
    id: Invalid UUID
  body:
    type: json
    content: |-
      {
          "name": "Vladimir Fokin",
          "email": "scobca18@yandex.ru"
      }
response:
  statusCode: 400
  statusText: ""
  headers:
    x-content-type-options: nosniff
    x-xss-protection: "0"
    cache-control: no-cache, no-store, max-age=0, must-revalidate
    pragma: no-cache
    expires: "0"
    x-frame-options: DENY
    content-type: application/json
    transfer-encoding: chunked
    date: Thu, 15 Oct 2026 22:41:52 GMT
    connection: close
  body:
    type: json
    content: |-
      {
        "status": 400,
        "message": "Неверный формат UUID"
      }
order: 4000
