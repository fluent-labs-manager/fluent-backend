name: login-docker
description: Authenticate to Docker Hub

inputs:
  username:
    required: true
    description: DockerHub username
  token:
    required: true
    description: DockerHub access token

runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}